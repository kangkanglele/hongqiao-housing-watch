
# Trigger Netlify after linking the GitHub identity in Netlify.
name: Deploy to Netlify

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          curl --fail --silent --show-error \
            --request POST "$NETLIFY_BUILD_HOOK"
