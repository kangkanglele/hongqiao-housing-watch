name: Test and deploy Netlify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test Netlify gateway
        run: node tests/test_gateway.mjs
      - name: Test Chrome extension queue
        run: node tests/test_extension.cjs
      - name: Check gateway syntax
        run: node --check netlify/functions/hq-api.mjs
      - name: Check Apps Script template syntax
        run: node --check < apps-script/Code.gs.example
      - name: Test Apps Script snapshot safety
        run: node tests/test_apps_script_snapshot.cjs

  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          curl --fail --silent --show-error \
            --request POST "$NETLIFY_BUILD_HOOK"
