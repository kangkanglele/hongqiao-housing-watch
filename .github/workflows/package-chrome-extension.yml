name: Package Chrome Extension

on:
  push:
    branches:
      - feat/chrome-plugin-snail-logo-20261124
    paths:
      - 'extension/**'
      - '.github/workflows/package-chrome-extension.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package unpacked extension
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -R extension "dist/BuyHouseAssistant_V0.9_SnailLogo"
          mv "dist/BuyHouseAssistant_V0.9_SnailLogo/安装说明.txt" "dist/BuyHouseAssistant_V0.9_SnailLogo/README.txt"
          cd dist
          zip -qr "../BuyHouseAssistant_V0.9_SnailLogo.zip" "BuyHouseAssistant_V0.9_SnailLogo"

      - name: Upload install package
        uses: actions/upload-artifact@v4
        with:
          name: buy-house-assistant-v0.9-snail-logo
          path: BuyHouseAssistant_V0.9_SnailLogo.zip
          if-no-files-found: error
          retention-days: 14
