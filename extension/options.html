<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>红桥房源采集助手 · 云端状态</title><style>body{font-family:system-ui,'Microsoft Yahei',sans-serif;margin:24px auto;max-width:550px;padding:0 18px;color:#173b33;line-height:1.8;background:#f6faf7}.box{background:white;border-radius:14px;padding:22px;margin:20px 0;border:1px solid #dce8e0}button{border:0;border-radius:8px;background:#167a63;color:white;padding:9px 17px;font-weight:650;cursor:pointer}button.secondary{background:#edf4ef;color:#205442}input{font-size:18px;width:130px;padding:9px;border-radius:8px;border:1px solid #c9d8cf;letter-spacing:.5em;text-align:center}h1{font-size:24px;margin-bottom:7px}p{color:#60776a}.num{font-size:22px;font-weight:800}#message{color:#9b4437}#status{word-break:break-word;color:#406b5b}</style></head><body>
<h1>红桥房源采集助手</h1><p>平时只要打开贝壳或我爱我家的单套详情页，点击插件图标一次，采集、保存和上传会自动完成。此页面只用于首次连接或查看异常。</p>
<div class="box"><h2>云端连接</h2><div id="authState">检测中…</div><div id="pinArea"><label for="pin">四位 PIN：</label><input id="pin" type="password" maxlength="4" inputmode="numeric" autocomplete="off" placeholder="••••"><button id="login">连接云端</button></div><p id="message"></p></div>
<div class="box"><h2>上传状态</h2><div class="num" id="count">0 条待同步</div><p id="status">正在读取状态…</p><p id="last"></p><button class="secondary" id="retry">重试待同步数据</button></div>
<script src="options.js"></script></body></html>
