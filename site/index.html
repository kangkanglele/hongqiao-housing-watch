/* V2 可信房源展示 */
.link-policy{background:#eef8f3;border-color:#cbe9db;color:#286b52}
.source-primary{margin-top:18px;padding:17px;background:#f4faf7;border:1px solid #cde6d8;border-radius:13px;display:grid;gap:12px}
.source-primary small{font-size:11px;color:#6f887c;line-height:1.6}
.bad-source{color:#a76b23;border-color:#f1dfba;background:#fffbf0}
.property-photo{position:relative;background:#f1f4f3;overflow:hidden;display:flex;align-items:center;justify-content:center;isolation:isolate}
.property-photo.card{height:165px;margin:-19px -20px 0;border-radius:17px 17px 0 0}
.property-photo.detail{height:225px;border-radius:13px;margin-bottom:19px}
.property-photo.thumb{width:68px;height:59px;flex-shrink:0;border-radius:9px}
.property-photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo-placeholder{display:flex;flex-direction:column;align-items:center;gap:2px;color:#aab5b3;font-size:11px}
.photo-placeholder .photo-symbol{font-size:42px;line-height:1.1;color:#b2c4bb}
.property-photo.thumb .photo-symbol{font-size:22px}
.property-photo.thumb .photo-placeholder span:last-child{display:none}
.photo-label{position:absolute;bottom:9px;right:10px;border-radius:6px;background:rgba(255,255,255,.87);font-size:10px;color:#657b70;padding:4px 7px}
.property-photo.thumb .photo-label{display:none}
.table-house{display:flex;align-items:center;gap:12px;min-width:185px}
.rich-empty{padding:56px 22px;display:flex;flex-direction:column;align-items:center;gap:10px}
.rich-empty strong{font-size:18px;color:#34483e}
.rich-empty p{max-width:510px;line-height:1.8;font-size:12px;margin:0 0 12px}
.empty-icon{font-size:50px;color:#9dbcb0}
.quarantine-list{display:grid;gap:10px;margin-top:18px}
.quarantine-item{padding:12px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #e7ecee}
.quarantine-item strong{font-size:12px;color:#34483e}
.quarantine-item .muted{font-size:11px;margin-top:5px}
@media(max-width:620px){.property-photo.card{height:175px}.property-photo.detail{height:185px}.quarantine-item{align-items:flex-start;flex-direction:column}.rich-empty{padding:35px 20px}.source-primary{padding:13px}}


/* V2.1 — 手机端右侧悬浮导航：避开浏览器底部工具栏，主内容为悬浮按钮预留空间 */
@media (max-width:730px) {
  .content{padding:26px calc(76px + env(safe-area-inset-right)) 52px 15px}
  .mobile-nav{
    position:fixed; top:50%; bottom:auto; left:auto; right:calc(9px + env(safe-area-inset-right));
    transform:translateY(-50%); width:57px; height:auto;
    max-height:calc(100dvh - 112px); min-height:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    overflow-y:auto; overflow-x:hidden; scrollbar-width:none;
    padding:6px 4px; border:1px solid #e1e9e5; border-radius:17px;
    background:rgba(255,255,255,.96); box-shadow:0 7px 28px rgba(29,48,40,.14);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); z-index:20;
  }
  .mobile-nav::-webkit-scrollbar{display:none}
  .mobile-nav button{
    flex:0 0 auto; width:47px; min-height:51px; padding:5px 1px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    border:0; border-radius:11px; background:transparent; color:#84929b;
    font-size:10px; font-weight:620; line-height:1.15; white-space:nowrap;
    -webkit-tap-highlight-color:transparent;
  }
  .mobile-nav button.active{background:#e7f5ef; color:#167a63; font-weight:750}
  .mobile-nav button:focus-visible{outline:2px solid #147b60;outline-offset:-2px}
  .mobile-nav b{font-size:21px;line-height:1;font-weight:500}
  .mobile-nav span{display:block}
  .drawer-body{padding-bottom:45px}
}
@media (max-width:350px) {
  .content{padding-right:calc(65px + env(safe-area-inset-right))}
  .mobile-nav{width:50px;right:calc(6px + env(safe-area-inset-right));padding:4px 3px}
  .mobile-nav button{width:42px;min-height:47px;font-size:9px}
  .mobile-nav b{font-size:18px}
}
@media (max-width:730px) and (max-height:525px){
  .mobile-nav{gap:0;padding:4px 3px;max-height:calc(100dvh - 64px)}
  .mobile-nav button{min-height:39px;padding:4px 1px;gap:1px}
  .mobile-nav b{font-size:17px}
  .mobile-nav span{font-size:9px}
}

/* V2.2 — 房源详情是列表上方的弹层，而非整屏侧抽屉/独立页面。
   桌面端为居中弹窗；手机端顶部始于视口约 20%，底部贴齐视口。 */
.detail-shade{align-items:center;justify-content:center}
.detail-sheet{
  width:min(680px,calc(100vw - 40px)); height: min(82vh,840px); height:min(82dvh,840px);
  max-height:calc(100dvh - 40px); border-radius:21px;
  overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain;
  box-shadow:0 22px 75px rgba(14,35,40,.22);
  -webkit-overflow-scrolling:touch; animation:detailAppear .2s ease-out;
}
.detail-sheet .drawer-body{padding-bottom:32px}
.detail-sheet .modal-header{
  position:sticky;top:0;z-index:4; background:rgba(255,255,255,.97);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  margin:-28px -30px 17px;padding:20px 30px 13px;
  border-bottom:1px solid #eef1f0;
}
.detail-sheet .icon-btn[data-close]{flex-shrink:0;width:39px;height:39px;border-radius:50%;font-size:25px}
@keyframes detailAppear{from{transform:translateY(13px) scale(.99);opacity:.75}to{transform:translateY(0) scale(1);opacity:1}}
@media(max-width:730px){
  .detail-shade{align-items:flex-end;justify-content:center}
  .detail-sheet{
    align-self:flex-end;flex:0 0 auto; width:100%;max-width:100%;
    height:80vh;max-height:80vh;height:80dvh;max-height:80dvh;
    margin:0; border-radius:22px 22px 0 0;
    box-shadow:0 -9px 45px rgba(16,28,34,.20);
  }
  .detail-sheet .drawer-body{padding:18px 18px calc(28px + env(safe-area-inset-bottom))}
  .detail-sheet .modal-header{margin:-18px -18px 14px;padding:16px 18px 11px;min-height:60px}
  .detail-sheet .detail-title{font-size:21px}
}
@media(max-width:730px) and (max-height:490px){
  .detail-sheet .modal-header{padding-top:10px;padding-bottom:8px;min-height:47px}
}

/* V2.5 数据分层入口：来源级别不同的记录绝不混入房源计数 */
.market-stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.market-stat{border:1px solid #dbe8e3;border-radius:12px;background:white;text-align:left;padding:14px;display:flex;flex-direction:column;gap:5px;color:#355248}
.market-stat:not(.passive):hover{background:#e9f4ee;border-color:#9bc6b1}
.market-stat b{font-size:27px;color:#167a63;letter-spacing:-.8px;font-variant-numeric:tabular-nums}
.market-stat strong{font-size:13px}.market-stat small{font-size:11px;color:#83948b;line-height:1.6}
.market-stat.passive{cursor:default}

function syncVisitToHouse(entry){
 const matched=visitMatchedHouse(entry);if(!matched)return;
 entry.houseId=matched.id;
 matched.events=matched.events||[];
 const eIndex=matched.events.findIndex(ev=>ev.kind==='visit'&&ev.visitEntryId===entry.id);
 if(entry.visitedAt){
   const previousPrice=matched.price;
   if(!matched.area&&entry.area)matched.area=entry.area;
   // 历史带看价是一次观察，不等于最新挂牌价；避免事后编辑旧行程覆盖当前报价。
   if(!matched.price&&entry.price)matched.price=entry.price;
   else if(entry.price&&previousPrice!==entry.price){
     const priceKey='visit-price-'+entry.id;
     const prior=matched.events.find(ev=>ev.kind==='visitPrice'&&ev.visitEntryId===priceKey);
     if(prior)prior.desc='本次带看记录报价 '+entry.price+' 万；当前主档案报价不自动覆盖';
     else matched.events.unshift({...ev(entry.visitedAt,'历史带看报价','本次带看记录报价 '+entry.price+' 万；主档案现价不自动覆盖','visitPrice'),visitEntryId:priceKey});
   }
   matched.stage='已看房';matched.lastSeen=nowDay();
   if(entry.decision==='不合适')matched.suitability='不合适';
   if(entry.decision==='继续考虑'||entry.decision==='值得议价')matched.suitability='合适';
   if(eIndex<0)matched.events.unshift({...ev(entry.visitedAt,'实地带看记录',entry.impression||entry.decision,'visit'),visitEntryId:entry.id});
   else matched.events[eIndex].desc=entry.impression||entry.decision;
 }else if(eIndex>=0){
   matched.events.splice(eIndex,1);
   matched.events=matched.events.filter(ev=>ev.visitEntryId!=='visit-price-'+entry.id);
 }
 // 初次带看时保存人工原始标签，重新编辑可正确撤回本次加上的硬伤。
 if(!Array.isArray(matched.baseDefects))matched.baseDefects=[...(matched.defects||[])];
 if(!Array.isArray(matched.baseDrawbacks))matched.baseDrawbacks=[...(matched.drawbacks||[])];
 const all=visitRecords().flatMap(sess=>(sess.entries||[]).filter(e=>e.visitedAt&&visitMatchedHouse(e)?.id===matched.id));
 matched.defects=[...new Set([...matched.baseDefects,...all.flatMap(x=>x.defects||[])])];
 matched.drawbacks=[...new Set([...matched.baseDrawbacks,...all.flatMap(x=>x.drawbacks||[])])];
 if(!all.length&&matched.stage==='已看房')matched.stage='准备看房';
 matched.top=matched.defects.includes('top');matched.duplex=matched.defects.includes('duplex');
 refreshScreeningTags(matched);
}
async function compressVisitPhoto(file){
 if(!file||!file.type.startsWith('image/'))throw Error('仅支持图片文件');
 if(file.size>12*1024*1024)throw Error('图片大于12MB，请先压缩');
 const src=await new Promise((ok,no)=>{const rd=new FileReader();rd.onload=()=>ok(rd.result);rd.onerror=no;rd.readAsDataURL(file)});
 const img=await new Promise((ok,no)=>{const t=new Image();t.onload=()=>ok(t);t.onerror=()=>no(Error('无法读取图片'));t.src=src});
 const max=210,scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);
 for(const quality of [.48,.35,.23]){const out=c.toDataURL('image/jpeg',quality);if(out.length<=12000)return out;}
 throw Error('缩略图仍过大，请选更简单的照片或附云盘链接');
}

async function compressPhoto(file){
 if(!file||!file.type.startsWith('image/'))throw new Error('请选择图片文件');
 if(file.size>12*1024*1024)throw new Error('图片超过12MB，请先压缩');
 const src=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});
 const image=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(new Error('图片无法解码'));i.src=src});
 const scale=Math.min(1,360/Math.max(image.width,image.height)),w=Math.max(1,Math.round(image.width*scale)),h=Math.max(1,Math.round(image.height*scale));
 const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(image,0,0,w,h);
 const data=canvas.toDataURL('image/jpeg',.54);
 if(data.length>65000)throw new Error('压缩后仍太大，请使用较小的图片');
 return data;
}

 }
